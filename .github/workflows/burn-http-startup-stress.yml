name: Burn HTTP startup readiness and streaming replay (research)

on:
  push:
    branches:
      - research/burn-portable-cleanup-fencing-20261108
  workflow_dispatch:

permissions:
  contents: read

jobs:
  http-startup-repeat:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repeat HTTP streaming startup and cleanup six times
        shell: bash
        run: |
          set -euo pipefail
          for iteration in 1 2 3 4 5 6; do
            echo "HTTP startup and streaming replay $iteration/6"
            python -m unittest discover -s tests -p test_burn_http_stream_crossplatform.py -v
          done
