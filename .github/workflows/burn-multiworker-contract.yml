name: Burn multiworker contract (expected failures, research only)

on:
  push:
    branches:
      - research/burn-multiprocess-invariants-20261108
  workflow_dispatch:

permissions:
  contents: read

jobs:
  existing-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Existing Burn contract must pass (21 tests)
        run: python -m unittest discover -s tests -p 'test_burn_download_quota.py' -v

  characterize-multiworker-gap:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Independently reproduce BOTH known cross-worker failures
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -p 'test_burn_multiworker_contract.py' -v > multiworker.log 2>&1
          exit_code=$?
          set -e
          cat multiworker.log
          if [ "$exit_code" -eq 0 ]; then
            echo "::error::Unexpected passing cross-worker tests; inspect the updated code and revise the characterization."
            exit 1
          fi
          grep -q 'Ran 2 tests' multiworker.log
          grep -q 'FAIL: test_cross_worker_cleanup_preserves_authorized_pack' multiworker.log
          grep -q 'FAIL: test_cross_worker_unlocked_session_is_recognized' multiworker.log
          if grep -q '^ERROR:' multiworker.log; then
            echo "::error::Test harness errored rather than exhibiting only the expected contract failures."
            exit 1
          fi
          echo 'CONFIRMED: two expected failures on real, distinct Python processes.'
