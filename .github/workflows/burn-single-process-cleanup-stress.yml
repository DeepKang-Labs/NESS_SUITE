name: NESS Burn actual cleanup repeated stability (research)

on:
  push:
    branches:
      - research/burn-single-process-cleanup-gates-20261108
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repeated-real-app-cleanup:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Replay five actual Burn cleanup scenarios four times
        shell: bash
        run: |
          set -euo pipefail
          for trial in 1 2 3 4; do
            echo "Actual-app cleanup characterization replay $trial/4"
            python -m unittest discover -s tests -p test_burn_cleanup_failure_gates.py -v
          done
