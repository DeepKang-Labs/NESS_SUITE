name: Burn portable cleanup fencing (Windows and Linux research)

on:
  push:
    branches:
      - research/burn-portable-cleanup-fencing-20261108
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-deletion-fencing:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Eight cross-platform OS-lock and stale-worker tests
        run: python -m unittest discover -s tests -p test_burn_portable_cleanup_fencing.py -v
      - name: Five durable SQLite session lease model tests
        run: python -m unittest discover -s tests -p test_burn_sqlite_lease_model.py -v
      - name: Ten bounded transfer and crash recovery tests
        run: python -m unittest discover -s tests -p test_burn_transfer_fencing_model.py -v
      - name: Six real synthetic filesystem crash tests
        run: python -m unittest discover -s tests -p test_burn_filesystem_crash_harness.py -v

  unchanged-app-and-streaming:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Existing twenty-one Burn regressions unchanged
        run: python -m unittest discover -s tests -p test_burn_download_quota.py -v
      - name: Four HTTP stream vs cleanup research cases
        run: python -m unittest discover -s tests -p test_burn_http_stream_crossplatform.py -v
