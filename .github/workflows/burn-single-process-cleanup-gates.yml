name: NESS Burn single-process cleanup failure characterization

on:
  push:
    branches:
      - research/burn-single-process-cleanup-gates-20261108
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actual-app-cleanup:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install NESS application dependencies
        run: python -m pip install -r requirements.txt
      - name: Test actual app cleanup after partial synthetic file failures (5 cases)
        run: python -m unittest discover -s tests -p test_burn_cleanup_failure_gates.py -v
      - name: Replay 21 original Burn quota regression tests
        run: python -m unittest discover -s tests -p test_burn_download_quota.py -v
