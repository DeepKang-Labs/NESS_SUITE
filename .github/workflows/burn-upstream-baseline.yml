name: Burn upstream baseline replay
on:
  push:
    branches:
      - ci/burn-upstream-baseline-20261108

permissions:
  contents: read

jobs:
  test-burn:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Burn regression tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests -p 'test_burn_download_quota.py' -v
