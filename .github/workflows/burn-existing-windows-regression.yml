name: Burn existing regression suite on Windows (research verification)

on:
  push:
    branches:
      - research/burn-http-stream-crossplatform-20261108
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app-burn-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing NESS dependencies
        run: python -m pip install -r requirements.txt
      - name: Unmodified 21 Burn application regressions on Windows
        run: python -m unittest discover -s tests -p test_burn_download_quota.py -v
